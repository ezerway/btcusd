name: Deploy to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudpanel
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to CloudPanel via Rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy files via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          echo "Starting rsync to ${SSH_USER}@${SSH_HOST}:${TARGET_DIR}..."
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_rsa" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.pnpm-store/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='data/*.json' \
            --exclude='.DS_Store' \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/"

      - name: Install dependencies & reload on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
          APP_NAME: ${{ secrets.PM2_APP_NAME || 'btcusd' }}
        run: |
          ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "bash -lc '
            set -e

            # 1. Load shell environment & NVM paths for non-interactive SSH
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            [ -s \"\$HOME/.profile\" ] && \. \"\$HOME/.profile\"
            [ -s \"\$HOME/.bashrc\" ] && \. \"\$HOME/.bashrc\" 2>/dev/null || true
            export PATH=\"\$HOME/.nvm/versions/node/\$(ls -1 \$HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:\$HOME/.local/bin:\$HOME/bin:/usr/local/bin:/usr/bin:\$PATH\"

            echo \"=== Server Environment ===\"
            echo \"Node: \$(node -v 2>/dev/null || echo 'not found')\"
            echo \"NPM:  \$(npm -v 2>/dev/null || echo 'not found')\"

            cd \"${TARGET_DIR}\"
            mkdir -p data

            echo \"=== Installing Dependencies ===\"
            if command -v pnpm &> /dev/null; then
              pnpm install --frozen-lockfile --prod
            elif command -v npm &> /dev/null; then
              npm install --omit=dev
            else
              echo \"Warning: neither pnpm nor npm found in PATH!\"
            fi

            echo \"=== Checking PM2 ===\"
            if ! command -v pm2 &> /dev/null; then
              echo \"pm2 not found in PATH. Checking global install or npx...\"
              if command -v npm &> /dev/null; then
                npm install -g pm2 || true
              fi
            fi

            if command -v pm2 &> /dev/null; then
              PM2_BIN=\"pm2\"
            elif command -v npx &> /dev/null; then
              PM2_BIN=\"npx pm2\"
            elif [ -f \"./node_modules/.bin/pm2\" ]; then
              PM2_BIN=\"./node_modules/.bin/pm2\"
            else
              echo \"ERROR: Neither pm2 nor npx could be executed!\"
              exit 1
            fi
            echo \"Using PM2 executable: \$PM2_BIN\"

            echo \"=== Managing Application with PM2 ===\"
            if \$PM2_BIN describe \"${APP_NAME}\" &> /dev/null; then
              echo \"Reloading existing process ${APP_NAME}...\"
              \$PM2_BIN reload \"${APP_NAME}\" --update-env || \$PM2_BIN restart \"${APP_NAME}\" --update-env
            else
              echo \"Starting new process ${APP_NAME}...\"
              if [ -f \"ecosystem.config.cjs\" ]; then
                \$PM2_BIN start ecosystem.config.cjs --name \"${APP_NAME}\"
              else
                \$PM2_BIN start npm --name \"${APP_NAME}\" -- start
              fi
            fi

            \$PM2_BIN save
            echo \"=== PM2 Process Status ===\"
            \$PM2_BIN status
            echo \"Deployment complete!\"
          '"
